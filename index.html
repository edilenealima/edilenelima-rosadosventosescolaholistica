<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rosa dos Ventos</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="topo-app">
  <img src="icon-192.png" alt="Rosa dos Ventos" class="logo-app">

  <div class="titulo-app">
    <h1>Edilene Lima</h1>
    <h2>Rosa dos Ventos Escola Holística</h2>
  </div>
</header>

  <!-- TELAS -->
  <main>
    <section class="tela ativa" id="inicio">
      <h1>🌹 Rosa dos Ventos</h1>
      <p>Bem-vinda ao seu espaço de cura.</p>
    </section>

    <section class="tela" id="terapias">
      <h1>✨ Terapias</h1>
      <p>Descrição das terapias holísticas.</p>
    </section>

    <section class="tela" id="oraculos">
      <h1>🔮 Oráculos</h1>
      <p>Baralho cigano, tarot e mais.</p>
    </section>

    <section class="tela" id="agenda">
      <h1>📅 Agenda</h1>
      <p>Agendamentos e atendimentos.</p>
    </section>

    <section class="tela" id="contato">
      <h1>💌 Contato</h1>
      <p>Fale comigo.</p>
    </section>
  </main>

  <!-- MENU INFERIOR -->
  <nav class="menu-app">
    <button onclick="mostrarTela('inicio')">🏠<span>Início</span></button>
    <button onclick="mostrarTela('terapias')">✨<span>Terapias</span></button>
    <button onclick="mostrarTela('oraculos')">🔮<span>Oráculos</span></button>
    <button onclick="mostrarTela('agenda')">📅<span>Agenda</span></button>
    <button onclick="mostrarTela('contato')">💌<span>Contato</span></button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
